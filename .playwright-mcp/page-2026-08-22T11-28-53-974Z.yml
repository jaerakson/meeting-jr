              - textbox [ref=f7e166]: "# 손지혜 알바 인터뷰 - 일시: 미상 (녹취 기준) - 참석자: 손재락 , 손지혜 - 회의 목적: 손지혜의 학원 아르바이트 경험 청취 ## 핵심 요약 (TL;DR) 손재락이 손지혜의 학원 알바 경험을 짧게 인터뷰했으나, 손지혜가 피로감과 기억 부족을 이유로 상세한 답변을 하지 못한 채 인터뷰가 마무리되었다. ## 주요 논의 및 안건 - 안건 1: 알바 업무 내용 — 학원에서 아이들의 그림 지도 보조 (잘 그리는지 확인, 질문 응대, 대화) - 안건 2: 알바 만족도 — 힘들었다고 언급 - 안건 3: 인상 깊었던 질문 — 기억나지 않는다고 답변, 구체적 내용 확인 불가 ## 주요 결정 사항 - 해당 인터뷰에서 공식적인 결정 사항 없음 ## 액션 아이템 (To-Do) - [ ] @손지혜 - 알바 문제 확인 및 해결 (기한: 미정) - [ ] @손재락 - 추후 상태가 나아지면 재인터뷰 진행 (기한: 미정) ## 이슈 및 리스크 - 이슈 1: 손지혜가 매번 알바 후 보수를 받지 못하고 있다고 언급 — 노무 관련 문제 가능성 있음 - 이슈 2: 인터뷰이의 피로도로 인해 충분한 정보 수집이 이루어지지 않음 - 이슈 3: 인터뷰 내용이 매우 짧고 단편적이어, 업무 전반에 대한 파악이 어려움"
